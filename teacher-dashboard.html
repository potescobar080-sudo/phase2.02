<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VENDOCINE — Teacher Dashboard</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main" style="flex:1;max-width:980px;margin:0 auto;width:100%">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:.8rem">
        <img src="assets/logo.svg" alt="" width="44"><h1 style="margin:0">Teacher Dashboard</h1>
      </div>
      <div><span id="teacherEmail" class="badge"></span> <button class="btn danger" id="logoutBtn">Sign out</button></div>
    </div>
    <div class="card">
      <h2>Classes</h2>
      <div class="table-wrap"><table><thead><tr><th>Class</th><th>Students</th><th>Pills remaining</th><th></th></tr></thead><tbody id="classBody"></tbody></table></div>
    </div>
  </main>

  <footer class="disclaimer-footer">⚠️ MANDATORY CLINICAL WARNING FOOTER: If symptoms persist, consult your Doctor.</footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
