<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VENDOCINE — Sign In</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="split">
    <section class="split-brand">
      <img src="assets/logo.svg" alt="VENDOCINE multi-ring medicine cross emblem">
      <h1>VENDOCINE</h1>
      <p>Security-gated medication dispensing and tracking for school clinics.</p>
    </section>
    <section class="split-form">
      <form id="loginForm" class="login-card" novalidate>
        <h2>Welcome back</h2>
        <p style="color:var(--muted);margin-top:0">Sign in with your school account.</p>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="loginError" class="error-text" role="alert"></div>
        <button id="loginBtn" class="btn" type="submit" style="width:100%;margin-top:.6rem">Sign In</button>
      </form>
    </section>
  </main>

  <footer class="disclaimer-footer">⚠️ MANDATORY CLINICAL WARNING FOOTER: If symptoms persist, consult your Doctor.</footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
